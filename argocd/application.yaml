apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rails-app
  namespace: argocd
spec:
  destination:
    name: ''
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/<your-username>/<private-repo>
    targetRevision: HEAD
    path: kubernetes
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

